name: PR29 final doc fix

on:
  push:
    branches:
      - refactor/kd3-speed-reference-model

permissions:
  contents: write

jobs:
  fix:
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
        with:
          ref: refactor/kd3-speed-reference-model
          fetch-depth: 0
      - name: Apply documentation fix
        run: python3 scripts/pr29_doc_fix.py
      - name: Commit cleaned documentation
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add -A
          git commit -m 'docs: correct KD3 schema migration ownership'
          git push origin HEAD:refactor/kd3-speed-reference-model
