name: PR29 maintenance runner

on:
  push:
    branches:
      - refactor/kd3-speed-reference-model

permissions:
  contents: write

jobs:
  refactor:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    env:
      APP_ENV: testing
      DB_CONNECTION: pgsql
      DB_HOST: 127.0.0.1
      DB_PORT: 5432
      DB_DATABASE: keiba_test
      DB_USERNAME: ci_test
      DB_PASSWORD: ci_test_local
      DB_URL: ''
    services:
      postgres:
        image: postgres:18-bookworm
        env:
          POSTGRES_DB: keiba_test
          POSTGRES_USER: ci_test
          POSTGRES_PASSWORD: ci_test_local
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U ci_test -d keiba_test"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 12
    steps:
      - uses: actions/checkout@v4
        with:
          ref: refactor/kd3-speed-reference-model
          fetch-depth: 0
      - uses: shivammathur/setup-php@v2
        with:
          php-version: '8.5'
          extensions: pdo_pgsql, mbstring, dom, xml, xmlwriter, zip
          coverage: none
          tools: composer:v2
      - name: Install dependencies
        run: composer install --no-interaction --prefer-dist --no-progress
      - name: Apply refactor
        run: python3 scripts/pr29_maintenance.py
      - name: Format PHP
        run: vendor/bin/pint app/Kd3/Domain/Kd3DomainImporter.php database/migrations/2026_09_06_000009_refactor_kd3_speed_references.php tests/Integration/Kd3DomainImporterTest.php tests/Integration/Kd3DomainSchemaTest.php
      - name: Static analysis and schema
        run: |
          composer lint
          composer analyse
          php artisan migrate:fresh --env=testing --no-interaction
      - name: PHP tests
        run: php artisan test
      - name: Commit validated refactor
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add -A
          git commit -m 'refactor: keep KD3 race classification on results'
          git push origin HEAD:refactor/kd3-speed-reference-model
