name: keiba

x-postgres: &postgres
  image: postgres:18-bookworm
  healthcheck:
    test: [CMD-SHELL, 'pg_isready -U "$${POSTGRES_USER}" -d "$${POSTGRES_DB}"']
    interval: 3s
    timeout: 3s
    retries: 20

services:
  app:
    build:
      context: .
      dockerfile: docker/php/Dockerfile
      args:
        LOCAL_UID: ${LOCAL_UID:-1000}
        LOCAL_GID: ${LOCAL_GID:-1000}
    volumes:
      - .:/var/www/html
    depends_on:
      postgres:
        condition: service_healthy
      postgres-test:
        condition: service_healthy
    healthcheck:
      test: [CMD, php, -r, 'exit(@fsockopen("127.0.0.1", 9000) ? 0 : 1);']
      interval: 5s
      timeout: 3s
      retries: 60
      start_period: 30s

  web:
    image: nginx:1.28-alpine
    ports:
      - '127.0.0.1:${APP_PORT:-8080}:80'
    volumes:
      - ./public:/var/www/html/public:ro
      - ./docker/nginx/default.conf:/etc/nginx/conf.d/default.conf:ro
    depends_on:
      app:
        condition: service_healthy

  postgres:
    <<: *postgres
    environment:
      POSTGRES_DB: keiba_dev
      POSTGRES_USER: keiba_dev
      POSTGRES_PASSWORD: ${DB_PASSWORD:-keiba_dev_local}
    volumes:
      - postgres-dev:/var/lib/postgresql

  postgres-test:
    <<: *postgres
    environment:
      POSTGRES_DB: keiba_test
      POSTGRES_USER: keiba_test
      POSTGRES_PASSWORD: keiba_test_local
    volumes:
      - postgres-test:/var/lib/postgresql

  postgres-perf:
    <<: *postgres
    profiles: [perf]
    environment:
      POSTGRES_DB: keiba_perf
      POSTGRES_USER: keiba_perf
      POSTGRES_PASSWORD: keiba_perf_local
    volumes:
      - postgres-perf:/var/lib/postgresql

volumes:
  postgres-dev:
  postgres-test:
  postgres-perf:
